# T2 (apple_bce) audio crackles under CPU load because the driver's IRQ
# thread stalls and the ring buffer underruns. Give the T2 outputs a larger
# period and extra headroom so short stalls do not starve the DMA.
# Only the built-in card is matched; USB-C dongles keep default latency.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_02_00.3.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom    = 8192
      }
    }
  }
]
