<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fedora makes Noto the default for each generic family in /etc/fonts.
     Flatpak apps can't see /etc/fonts, so their runtime falls back to DejaVu.
     Repeat Fedora's choices here, because Flatpak shares this directory with
     every app through the global override. This changes nothing on the host. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
