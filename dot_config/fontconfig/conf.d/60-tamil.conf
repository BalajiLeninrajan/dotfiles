<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Per-glyph fallback for Tamil picks FreeSerif (pulled in by TeX Live),
     then Droid Sans Tamil, before Noto. Hide both so Tamil lands on Noto. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/gnu-freefont/*</glob>
      <glob>/usr/share/fonts/google-droid-sans-fonts/DroidSansTamil-*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
