<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Per-glyph fallback for Tamil picks FreeSerif (from TeX Live on the host,
     and from the Flatpak runtime), then Droid Sans Tamil, before Noto. Reject
     both by family so Tamil lands on Noto. Matching on family instead of path
     also covers Flatpak apps, which see host fonts under /run/host/fonts. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>FreeSerif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Droid Sans Tamil</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
