# UW runs on Microsoft 365 and only accepts OAuth2. mutt_oauth2.py holds the
# refresh token in a GPG-encrypted file and prints a fresh access token.
# First-time setup:
#   mutt_oauth2.py ~/.local/share/aerc/uwaterloo.tokens --verbose --authorize \
#     --provider microsoft --authflow localhostauthcode \
#     --email bleninra@uwaterloo.ca --client-id 9e5f94bc-e8a4-4e73-b8be-63364c29d753
[UWaterloo]
source            = imaps+xoauth2://bleninra%40uwaterloo.ca@outlook.office365.com:993
source-cred-cmd   = mutt_oauth2.py ~/.local/share/aerc/uwaterloo.tokens
outgoing          = smtp+xoauth2://bleninra%40uwaterloo.ca@smtp.office365.com:587
outgoing-cred-cmd = mutt_oauth2.py ~/.local/share/aerc/uwaterloo.tokens
from              = Balaji Leninrajan <bleninra@uwaterloo.ca>
default           = INBOX
copy-to           =
postpone          = Drafts
archive           = Archive
folders-sort      = INBOX,Drafts,Sent Items,Archive
folders-exclude   = ~^Calendar,Contacts,Conversation History,Journal,Notes,Outbox,Tasks,Events,Trash
cache-headers     = true

# Gmail with an app password (needs 2-Step Verification on the Google account).
# The password lives in the GNOME keyring. First-time setup:
#   secret-tool store --label='aerc gmail' service aerc account gmail
# Gmail files sent mail in [Gmail]/Sent Mail on its own, so copy-to is empty
# to avoid a second copy.
[Gmail]
source            = imaps://bleninrajan%40gmail.com@imap.gmail.com:993
source-cred-cmd   = secret-tool lookup service aerc account gmail
outgoing          = smtps://bleninrajan%40gmail.com@smtp.gmail.com:465
outgoing-cred-cmd = secret-tool lookup service aerc account gmail
from              = Balaji Leninrajan <bleninrajan@gmail.com>
default           = INBOX
copy-to           =
postpone          = [Gmail]/Drafts
archive           = [Gmail]/All Mail
folders-sort      = INBOX,[Gmail]/Starred,[Gmail]/Drafts,[Gmail]/Sent Mail,[Gmail]/All Mail
cache-headers     = true
