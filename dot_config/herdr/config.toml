onboarding = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
tab_bar_position = "bottom"
accent = "#cba6f7"
status_indicators = "symbols"

[keys]
prefix = "ctrl+f"
split_horizontal = "prefix+d"
new_tab = "prefix+t"
copy_mode = "prefix+c"

# Navigation follows nvim (shift+h/l buffers) and niri (i/o workspaces).
previous_tab = "prefix+shift+h"
next_tab = "prefix+shift+l"
next_workspace = "prefix+i"
previous_workspace = "prefix+o"
next_agent = "prefix+shift+i"
previous_agent = "prefix+shift+o"
# Navigate mode checks these first, so i/o step workspaces without leaving it.
navigate_workspace_down = "i"
navigate_workspace_up = "o"

# Displaced by the above: swaps default to prefix+shift+hjkl, and the
# notification jump defaults to prefix+o.
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"
open_notification_target = "prefix+a"
