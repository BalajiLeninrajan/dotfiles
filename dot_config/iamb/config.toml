default_profile = "beeper"

[profiles.beeper]
user_id = "@gitbranch:beeper.com"

[settings]
theme = "catppuccin-mocha-dark"
username_display = "displayname"
state_event_display = false
# Hide bridge bots from :members and the timeline.
service_member_display = false
default_split = "vertical"
ignorecase = true
# Room for the sender's name before messages start (default 30). Longer names get truncated.
user_gutter_width = 16
# Yank and paste through the system clipboard, like Vim's clipboard=unnamedplus.
default_register = "+"

[settings.mouse]
enabled = false

# Newest chat first in every list. chats, dms and spaces inherit the rooms value.
[settings.sort]
rooms = ["recent"]
space = ["recent"]

[settings.notifications]
enabled = true
sound_hint = "message-new-instant"

# <C-W>f always opens the new split to the left; <C-W>F opens it, then moves it right.
# Not remapping <C-W>f itself, in case macro output goes back through the keymap and loops.
[macros."normal|visual"]
"<C-W>F" = "<C-W>f<C-W>L"
# <Bslash> leads jumps between chats. g stays for jumps inside a chat, as in Vim.
"<Bslash>s" = ":spaces<Enter>"
"<Bslash>r" = ":unreads<Enter>"
"<Bslash>R" = ":unreads clear<Enter>"
"<Bslash>m" = ":mentions<Enter>"
# Fuzzy-pick a chat. Inside a space or a room list, it picks from that list instead.
"<Bslash><Bslash>" = ":pick<Enter>"

# g + letter acts on the selected message.
# gr shadows Vim's virtual replace of one character, which a chat composer never needs.
"gr" = ":reply<Enter>"
# Jump to the message this one replies to, like Vim's go-to-definition.
"gd" = ":replied<Enter>"
"gx" = ":open<Enter>"
"gc" = ":edit<Enter>"
"gp" = ":pin<Enter>"
# Drop the current reply or edit and wipe the draft, without asking.
"<Bslash>c" = ":cancel!<Enter>"
# Pick an emoji from the fuzzy list. Shadows Vim's print-ASCII-value, which is unmapped here.
"ga" = ":react<Enter>"
# Stops at the prompt, to confirm the delete.
"gD" = ":redact"

# Backspace goes back to what this window showed before (Vim's alternate buffer).
# Normal mode only, so it still deletes in the composer.
[macros.normal]
"<BS>" = "<C-^>"

# Start on the spaces list instead of the welcome screen.
[layout]
style = "config"

[[layout.tabs]]
window = "iamb://spaces"
