# Playback
hwdec=auto-safe
keep-open=yes
force-window=immediate
cursor-autohide=1000
volume-max=150

# Languages and subtitles
alang=en,eng
slang=en,eng
sub-auto=fuzzy

# Links opened through yt-dlp
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# Screenshots
screenshot-directory=~/Pictures/Screenshots
screenshot-template=mpv-%F-%wH%wM%wS
screenshot-format=png

# Catppuccin Mocha, mauve accent
background-color='#1e1e2e'
osd-font='JetBrainsMono Nerd Font'
osd-font-size=28
osd-color='#cdd6f4'
osd-outline-color='#11111b'
osd-back-color='#11111b'
osd-selected-color='#cba6f7'
osd-bar-h=2
sub-color='#cdd6f4'
sub-outline-color='#11111b'
sub-back-color='#11111b'
