# tmux for the student.cs nodes, loosely following the herdr config: vim-style
# pane keys, catppuccin mocha with a mauve accent, tab bar at the bottom.
#
# The prefix is ctrl+b rather than herdr's ctrl+f because this usually runs
# inside a local herdr pane, and herdr swallows ctrl+f.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
# Yanks leave through OSC 52, so a copy on the server lands in the laptop's
# clipboard.
set -g set-clipboard on
set -g detach-on-destroy off

# --- Keys -------------------------------------------------------------------

bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind q detach-client

bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

bind t new-window -c "#{pane_current_path}"
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind -r n next-window
bind -r p previous-window

bind c copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Theme: catppuccin mocha ------------------------------------------------

set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
# The session block turns red while the prefix is armed.
set -g status-left "#{?client_prefix,#[bg=#f38ba8],#[bg=#cba6f7]}#[fg=#11111b]#[bold] #S #[default] "
# student.cs hands out a different node per login, and a session only exists
# on the node that started it, so show which node this is.
set -g status-right "#{?window_zoomed_flag,#[fg=#f9e2af]zoom ,}#[fg=#a6adc8]#{host_short} "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[fg=#cba6f7,bg=#313244,bold] #I #W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g clock-mode-colour "#cba6f7"
